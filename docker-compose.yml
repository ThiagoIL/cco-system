# Ambiente local. Em produção (Easypanel) o Postgres é um serviço do próprio painel.
#
#   docker compose up -d db          # só o banco (desenvolvimento com `npm run dev`)
#   docker compose --profile app up  # banco + app em container (teste da imagem de produção)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cco
    ports:
      - "5432:5432"
    volumes:
      - cco-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cco"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cco
      AUTH_SECRET: ${AUTH_SECRET:-troque-por-um-valor-aleatorio-com-pelo-menos-32-caracteres}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador CCO}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rcondredetel.com.br}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-troque-esta-senha}
      NEXTAUTH_URL: http://localhost:3000
      TZ: America/Sao_Paulo
    ports:
      - "3000:3000"

volumes:
  cco-db:
